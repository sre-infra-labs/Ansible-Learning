---
# ── SQL Server ──────────────────────────────────────────────────────────
mssql_version: "2025"
mssql_pid: "Developer"         # Developer | Enterprise | Standard | Evaluation
mssql_port: 1433

# Microsoft package repositories (Ubuntu 24.04 – Debian family)
mssql_repo_list_url: "https://packages.microsoft.com/config/ubuntu/24.04/mssql-server-2025.list"
mssql_prod_repo_list_url: "https://packages.microsoft.com/config/ubuntu/24.04/prod.list"
mssql_ms_gpg_key_url: "https://packages.microsoft.com/keys/microsoft.asc"

# Microsoft package repositories (RHEL 9 – RedHat family)
mssql_repo_rhel_url: "https://packages.microsoft.com/config/rhel/9/mssql-server-2025.repo"
mssql_prod_repo_rhel_url: "https://packages.microsoft.com/config/rhel/9/prod.repo"

# ── Directory layout (all on Disk 1 / root fs) ──────────────────────────
mssql_base_dir: "/var/opt/mssql"
mssql_data_dir: "/var/opt/mssql/data"
mssql_systemdbs_dir: "/var/opt/mssql/data/systemdbs"
mssql_tempdb_dir: "/var/opt/mssql/data/tempdb"
mssql_userdbs_dir: "/var/opt/mssql/data/userdbs"
mssql_backup_dir: "/var/opt/mssql/backup"
mssql_log_dir: "/var/opt/mssql/log"
mssql_os_user: "mssql"
mssql_os_group: "mssql"

# ── Disk 2 (vdb – 120 GB) for StackOverflow restore ─────────────────────
disk2_device: "/dev/vdb"
disk2_partition: "/dev/vdb1"
disk2_mount: "/mssql-data2"
disk2_fstype: "ext4"

# ── Network ─────────────────────────────────────────────────────────────
internal_prefix: "24"
internal_dns_servers:
  - "192.168.100.10"
  - "192.168.200.10"
internal_route_subnet: "192.168.0.0/16"
ignore_internet_error: false

# ── Firewall ────────────────────────────────────────────────────────────
firewall_tcp_ports:
  - "1433"
  - "1434"
  - "80"
  - "443"
  - "5022"
  - "22"
  - "21"
firewall_udp_ports:
  - "1434"

# ── Databases to Restore ────────────────────────────────────────────────
databases_to_restore:
  # - name: "StackOverflow2013"
  #   bak_src: "/stale-storage/Softwares/SQL_Server_Setups/SqlServer-Samples-Dbs/StackOverflow2013.bak"
  #   bak_dest: "/mssql-data2/StackOverflow2013.bak"
  #   data_destination: "/mssql-data2/"
  - name: "StackOverflowMini"
    bak_src: "/stale-storage/Softwares/SQL_Server_Setups/SqlServer-Samples-Dbs/StackOverflowMini.bak"
    bak_dest: "/mssql-data2/StackOverflowMini.bak"
    data_destination: "/mssql-data2/"

