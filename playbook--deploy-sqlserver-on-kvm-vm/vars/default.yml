---
# ── SQL Server ──────────────────────────────────────────────────────────
mssql_version: "2025"
mssql_pid: "Developer"         # Developer | Enterprise | Standard | Evaluation
mssql_port: 1433

# Microsoft package repositories (Ubuntu 24.04)
mssql_repo_list_url: "https://packages.microsoft.com/config/ubuntu/24.04/mssql-server-2025.list"
mssql_prod_repo_list_url: "https://packages.microsoft.com/config/ubuntu/24.04/prod.list"
mssql_ms_gpg_key_url: "https://packages.microsoft.com/keys/microsoft.asc"

# ── Directory layout (all on Disk 1 / root fs) ──────────────────────────
mssql_base_dir: "/var/opt/mssql"
mssql_data_dir: "/var/opt/mssql/data"
mssql_systemdbs_dir: "/var/opt/mssql/data/systemdbs"
mssql_tempdb_dir: "/var/opt/mssql/data/tempdb"
mssql_userdbs_dir: "/var/opt/mssql/data/userdbs"
mssql_backup_dir: "/var/opt/mssql/backup"
mssql_log_dir: "/var/opt/mssql/log"
mssql_os_user: "mssql"
mssql_os_group: "mssql"

# ── Disk 2 (vdb – 120 GB) for StackOverflow restore ─────────────────────
disk2_device: "/dev/vdb"
disk2_partition: "/dev/vdb1"
disk2_mount: "/mssql-data2"
disk2_fstype: "ext4"

# ── Network ─────────────────────────────────────────────────────────────
internal_nic: "enp1s0"
nat_nic: "enp7s0"
internal_ip: "192.168.100.54"
internal_prefix: "24"
internal_dns_servers:
  - "192.168.100.10"
  - "192.168.200.10"
internal_gateway: "192.168.100.10"
internal_route_subnet: "192.168.0.0/16"
ignore_internet_error: false

# ── Firewall ────────────────────────────────────────────────────────────
firewall_tcp_ports:
  - "1433"
  - "1434"
  - "80"
  - "443"
  - "5022"
  - "22"
  - "21"
firewall_udp_ports:
  - "1434"

# ── StackOverflow restore ────────────────────────────────────────────────
stackoverflow_bak_src: "/stale-storage/Softwares/SQL_Server_Setups/SqlServer-Samples-Dbs/StackOverflow2013.bak"
stackoverflow_bak_dest: "/mssql-data2/StackOverflow2013.bak"
stackoverflow_db_name: "StackOverflow2013"
stackoverflow_data_file: "/mssql-data2/StackOverflow2013.mdf"
stackoverflow_log_file: "/mssql-data2/StackOverflow2013_log.ldf"

# ── Connectivity verification ────────────────────────────────────────────
verify_target_ip: "192.168.100.54"
verify_port: 1433
