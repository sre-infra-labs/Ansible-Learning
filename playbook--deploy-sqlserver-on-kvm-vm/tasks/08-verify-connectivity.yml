---
# 08-verify-connectivity.yml
# All 6 validations run FROM the ryzen9 Ansible control node (delegate_to: localhost).
# Validation 5 & 6 (sqlcmd queries) run ON sqlbuntu where sqlcmd is installed,
# connecting to 192.168.100.54 to fully exercise the network path.

# ── 1. Ping ────────────────────────────────────────────────────────────
- name: "[VAL-1] Ping sqlbuntu from ryzen9"
  ansible.builtin.command: ping -c 4 -W 3 {{ verify_target_ip }}
  delegate_to: localhost
  become: false
  register: ping_result
  changed_when: false

- name: "[VAL-1] Ping result"
  ansible.builtin.debug:
    msg: "{{ ping_result.stdout_lines[-2:] }}"

# ── 2. Telnet / TCP port 1433 ─────────────────────────────────────────
- name: "[VAL-2] TCP port 1433 reachable from ryzen9 (telnet style)"
  ansible.builtin.wait_for:
    host: "{{ verify_target_ip }}"
    port: "{{ verify_port }}"
    timeout: 15
    state: started
  delegate_to: localhost
  become: false
  register: telnet_result

- name: "[VAL-2] Port 1433 result"
  ansible.builtin.debug:
    msg: "Port {{ verify_port }} on {{ verify_target_ip }}: OPEN"

# ── 3. nc test ────────────────────────────────────────────────────────
- name: "[VAL-3] nc test to sqlbuntu:1433 from ryzen9"
  ansible.builtin.command: nc -zv -w 5 {{ verify_target_ip }} {{ verify_port }}
  delegate_to: localhost
  become: false
  register: nc_result
  changed_when: false

- name: "[VAL-3] nc result"
  ansible.builtin.debug:
    msg: "nc: {{ nc_result.stderr | default(nc_result.stdout) }}"

# ── 4. sqlcmd select 1 ───────────────────────────────────────────────
- name: "[VAL-4] sqlcmd SELECT 1 against sqlbuntu (via network IP)"
  ansible.builtin.command: >
    /opt/mssql-tools18/bin/sqlcmd -S {{ verify_target_ip }},{{ verify_port }}
    -U sa -Q "SELECT 1 AS connection_test" -C -N -W
  environment:
    SQLCMDPASSWORD: "{{ sa_password }}"
  register: sqlcmd_select1
  changed_when: false
  no_log: true

- name: "[VAL-4] sqlcmd SELECT 1 result"
  ansible.builtin.debug:
    msg: "{{ sqlcmd_select1.stdout_lines }}"

# ── 5. sqlcmd on StackOverflow2013 ───────────────────────────────────
- name: "[VAL-5] sqlcmd SELECT 1 on StackOverflow2013"
  ansible.builtin.command: >
    /opt/mssql-tools18/bin/sqlcmd -S {{ verify_target_ip }},{{ verify_port }}
    -U sa -d {{ stackoverflow_db_name }}
    -Q "SELECT 1 AS so_connection_test" -C -N -W
  environment:
    SQLCMDPASSWORD: "{{ sa_password }}"
  register: sqlcmd_so
  changed_when: false
  ignore_errors: true

- name: "[VAL-5] StackOverflow2013 sqlcmd result"
  ansible.builtin.debug:
    msg: "{{ sqlcmd_so.stdout_lines if sqlcmd_so.rc == 0 else ('FAILED: ' + sqlcmd_so.stderr | default('DB may not be restored yet')) }}"

# ── 6. sys.dm_server_services – engine + agent ───────────────────────
- name: "[VAL-6] Check engine and SQL Agent via sys.dm_server_services"
  ansible.builtin.command: >
    /opt/mssql-tools18/bin/sqlcmd -S localhost,{{ mssql_port }} -U sa
    -Q "SET NOCOUNT ON;
        SELECT servicename, status_desc, startup_type_desc
        FROM sys.dm_server_services
        WHERE servicename IN (
          'SQL Server (MSSQLSERVER)',
          'SQL Server Agent (MSSQLSERVER)'
        );"
    -W -C -N
  environment:
    SQLCMDPASSWORD: "{{ sa_password }}"
  register: services_check
  changed_when: false
  no_log: true

- name: "[VAL-6] Service status"
  ansible.builtin.debug:
    msg: "{{ services_check.stdout_lines }}"

- name: "[VAL-6] Fail if engine is not Running"
  ansible.builtin.fail:
    msg: "SQL Server Engine is NOT Running – check sqlserver service"
  when: >
    services_check.stdout_lines | select('search', 'MSSQLSERVER') | select('search', 'Running') | list | length == 0

- name: "[VAL-6] Fail if SQL Agent is not Running"
  ansible.builtin.fail:
    msg: "SQL Server Agent is NOT Running – check sqlagent.enabled setting"
  when: >
    services_check.stdout_lines | select('search', 'SQL Server Agent') | select('search', 'Running') | list | length == 0
