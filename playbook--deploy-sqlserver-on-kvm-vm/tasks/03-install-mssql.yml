---
# 03-install-mssql.yml
# Add Microsoft GPG key + SQL Server 2025 repo, then install mssql-server.
# Supports Debian/Ubuntu (apt) and RedHat/RHEL (dnf).

# ── Debian/Ubuntu ────────────────────────────────────────────────────────────

- name: "[Debian] Install prerequisite packages"
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: "[Debian] Download and install Microsoft GPG key (signed-by approach)"
  ansible.builtin.shell:
    cmd: >
      curl -fsSL {{ mssql_ms_gpg_key_url }}
      | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
    creates: /usr/share/keyrings/microsoft-prod.gpg
  when: ansible_facts['os_family'] == 'Debian'

- name: "[Debian] Add SQL Server 2025 repository for Ubuntu 24.04"
  ansible.builtin.shell:
    cmd: >
      curl -fsSL {{ mssql_repo_list_url }}
      | tee /etc/apt/sources.list.d/mssql-server-2025.list
    creates: /etc/apt/sources.list.d/mssql-server-2025.list
  when: ansible_facts['os_family'] == 'Debian'

- name: "[Debian] Update apt cache after adding SQL Server 2025 repository"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: ansible_facts['os_family'] == 'Debian'

- name: "[Debian] Install SQL Server 2025 (mssql-server)"
  ansible.builtin.apt:
    name: mssql-server
    state: present
  register: mssql_pkg_installed_deb
  when: ansible_facts['os_family'] == 'Debian'

# ── RedHat/RHEL ──────────────────────────────────────────────────────────────

- name: "[RedHat] Install prerequisite packages"
  ansible.builtin.dnf:
    name:
      - curl
      - gnupg2
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: "[RedHat] Import Microsoft GPG key"
  ansible.builtin.rpm_key:
    key: "{{ mssql_ms_gpg_key_url }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: "[RedHat] Add SQL Server 2025 repository for RHEL 9"
  ansible.builtin.shell:
    cmd: >
      curl -fsSL {{ mssql_repo_rhel_url }}
      | tee /etc/yum.repos.d/mssql-server-2025.repo
    creates: /etc/yum.repos.d/mssql-server-2025.repo
  when: ansible_facts['os_family'] == 'RedHat'

- name: "[RedHat] Install SQL Server 2025 (mssql-server)"
  ansible.builtin.dnf:
    name: mssql-server
    state: present
  register: mssql_pkg_installed_rhel
  when: ansible_facts['os_family'] == 'RedHat'

# ── Both: verify installation ─────────────────────────────────────────────────

- name: Verify mssql-server binary exists
  ansible.builtin.stat:
    path: /opt/mssql/bin/mssql-conf
  register: mssql_conf_stat

- name: Fail if mssql-server was not installed correctly
  ansible.builtin.fail:
    msg: "mssql-conf not found at /opt/mssql/bin/mssql-conf – installation may have failed"
  when: not mssql_conf_stat.stat.exists
